<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#f0fdfa"/>
  <!-- V-Net architecture: V-shaped encoder-decoder -->
  <!-- Encoder (left side going down) -->
  <rect x="15" y="25" width="40" height="20" rx="4" fill="#0d9488" opacity="0.5"/>
  <rect x="25" y="55" width="35" height="20" rx="4" fill="#0d9488" opacity="0.6"/>
  <rect x="35" y="85" width="30" height="20" rx="4" fill="#0d9488" opacity="0.7"/>
  <rect x="45" y="115" width="25" height="20" rx="4" fill="#0d9488" opacity="0.8"/>
  <!-- Bottleneck -->
  <rect x="75" y="145" width="50" height="22" rx="4" fill="#0d9488" opacity="1.0"/>
  <!-- Decoder (right side going up) -->
  <rect x="130" y="115" width="25" height="20" rx="4" fill="#0d9488" opacity="0.8"/>
  <rect x="135" y="85" width="30" height="20" rx="4" fill="#0d9488" opacity="0.7"/>
  <rect x="140" y="55" width="35" height="20" rx="4" fill="#0d9488" opacity="0.6"/>
  <rect x="145" y="25" width="40" height="20" rx="4" fill="#0d9488" opacity="0.5"/>
  <!-- Encoder arrows (down) -->
  <line x1="35" y1="45" x2="42" y2="55" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="42" y1="75" x2="50" y2="85" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="105" x2="58" y2="115" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="58" y1="135" x2="75" y2="150" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <!-- Decoder arrows (up) -->
  <line x1="125" y1="150" x2="142" y2="135" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="142" y1="115" x2="150" y2="105" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="85" x2="158" y2="75" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <line x1="158" y1="55" x2="165" y2="45" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <!-- Skip connections (horizontal dashed lines) -->
  <line x1="55" y1="35" x2="145" y2="35" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="60" y1="65" x2="140" y2="65" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="65" y1="95" x2="135" y2="95" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="70" y1="125" x2="130" y2="125" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Skip connection arrows -->
  <polygon points="145,32 140,35 145,38" fill="#0d9488" opacity="0.4"/>
  <polygon points="140,62 135,65 140,68" fill="#0d9488" opacity="0.4"/>
  <polygon points="135,92 130,95 135,98" fill="#0d9488" opacity="0.4"/>
  <polygon points="130,122 125,125 130,128" fill="#0d9488" opacity="0.4"/>
  <!-- Label -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">V-Net Architecture</text>
</svg>
