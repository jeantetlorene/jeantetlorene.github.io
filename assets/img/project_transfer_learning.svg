<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#f0fdfa"/>
  <!-- Left neural network node cluster -->
  <g>
    <!-- Input layer -->
    <circle cx="35" cy="60" r="8" fill="#0d9488" opacity="0.5"/>
    <circle cx="35" cy="90" r="8" fill="#0d9488" opacity="0.5"/>
    <circle cx="35" cy="120" r="8" fill="#0d9488" opacity="0.5"/>
    <!-- Hidden layer -->
    <circle cx="70" cy="75" r="9" fill="#0d9488" opacity="0.7"/>
    <circle cx="70" cy="105" r="9" fill="#0d9488" opacity="0.7"/>
    <!-- Output -->
    <circle cx="70" cy="140" r="7" fill="#0d9488" opacity="0.5"/>
    <!-- Connections -->
    <line x1="43" y1="60" x2="61" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="43" y1="60" x2="61" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="43" y1="90" x2="61" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="43" y1="90" x2="61" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="43" y1="120" x2="61" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="43" y1="120" x2="61" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Transfer arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
    </marker>
  </defs>
  <line x1="85" y1="90" x2="115" y2="90" stroke="#0d9488" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- Curved dashed lines around arrow -->
  <path d="M 88 80 Q 100 70 112 80" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M 88 100 Q 100 110 112 100" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Right neural network node cluster -->
  <g>
    <!-- Input layer -->
    <circle cx="130" cy="60" r="8" fill="#0d9488" opacity="0.5"/>
    <circle cx="130" cy="90" r="8" fill="#0d9488" opacity="0.5"/>
    <circle cx="130" cy="120" r="8" fill="#0d9488" opacity="0.5"/>
    <!-- Hidden layer -->
    <circle cx="165" cy="75" r="9" fill="#0d9488" opacity="0.9"/>
    <circle cx="165" cy="105" r="9" fill="#0d9488" opacity="0.9"/>
    <!-- Output -->
    <circle cx="165" cy="140" r="7" fill="#0d9488" opacity="0.5"/>
    <!-- Connections -->
    <line x1="138" y1="60" x2="156" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="138" y1="60" x2="156" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="138" y1="90" x2="156" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="138" y1="90" x2="156" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="138" y1="120" x2="156" y2="75" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
    <line x1="138" y1="120" x2="156" y2="105" stroke="#0d9488" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Labels -->
  <text x="52" y="170" font-family="Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">Source</text>
  <text x="148" y="170" font-family="Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">Target</text>
  <!-- Small species icons -->
  <text x="52" y="185" font-family="Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" opacity="0.6">Species A</text>
  <text x="148" y="185" font-family="Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" opacity="0.6">Species B</text>
</svg>
