<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#f0fdfa"/>
  <!-- Sound waves -->
  <path d="M 30 100 Q 30 60 30 100" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.3"/>
  <path d="M 40 100 C 40 70 40 70 40 100 C 40 130 40 130 40 100" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.4"/>
  <path d="M 50 100 C 50 55 50 55 50 100 C 50 145 50 145 50 100" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.5"/>
  <path d="M 60 100 C 60 45 60 45 60 100 C 60 155 60 155 60 100" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.6"/>
  <path d="M 70 100 C 70 50 70 50 70 100 C 70 150 70 150 70 100" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.7"/>
  <!-- Bird silhouette -->
  <g transform="translate(130, 70)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#0d9488"/>
    <!-- Head -->
    <circle cx="20" cy="-5" r="7" fill="#0d9488"/>
    <!-- Beak -->
    <polygon points="27,-5 34,-4 27,-3" fill="#0d9488"/>
    <!-- Eye -->
    <circle cx="22" cy="-6" r="1.5" fill="#f0fdfa"/>
    <!-- Tail -->
    <polygon points="-18,0 -30,-8 -28,5" fill="#0d9488"/>
    <!-- Wing -->
    <ellipse cx="-2" cy="-3" rx="12" ry="6" fill="#0d9488" opacity="0.8" transform="rotate(-10 -2 -3)"/>
  </g>
  <!-- Waveform at bottom -->
  <polyline points="20,150 30,140 40,152 50,135 55,148 60,130 65,150 70,125 75,150 80,132 85,148 90,138 95,145 100,140 105,148 110,135 115,150 120,128 125,148 130,138 135,145 140,140 145,150 150,142 155,148 160,138 170,145 180,140" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Frequency bars -->
  <rect x="25" y="165" width="4" height="15" rx="1" fill="#0d9488" opacity="0.3"/>
  <rect x="35" y="160" width="4" height="20" rx="1" fill="#0d9488" opacity="0.4"/>
  <rect x="45" y="158" width="4" height="22" rx="1" fill="#0d9488" opacity="0.5"/>
  <rect x="55" y="162" width="4" height="18" rx="1" fill="#0d9488" opacity="0.6"/>
  <rect x="65" y="155" width="4" height="25" rx="1" fill="#0d9488" opacity="0.7"/>
  <rect x="75" y="160" width="4" height="20" rx="1" fill="#0d9488" opacity="0.5"/>
  <rect x="85" y="163" width="4" height="17" rx="1" fill="#0d9488" opacity="0.4"/>
  <rect x="95" y="158" width="4" height="22" rx="1" fill="#0d9488" opacity="0.6"/>
  <rect x="105" y="165" width="4" height="15" rx="1" fill="#0d9488" opacity="0.3"/>
  <rect x="115" y="160" width="4" height="20" rx="1" fill="#0d9488" opacity="0.5"/>
  <rect x="125" y="155" width="4" height="25" rx="1" fill="#0d9488" opacity="0.7"/>
  <rect x="135" y="162" width="4" height="18" rx="1" fill="#0d9488" opacity="0.4"/>
  <rect x="145" y="158" width="4" height="22" rx="1" fill="#0d9488" opacity="0.6"/>
  <rect x="155" y="163" width="4" height="17" rx="1" fill="#0d9488" opacity="0.5"/>
  <rect x="165" y="165" width="4" height="15" rx="1" fill="#0d9488" opacity="0.3"/>
</svg>
